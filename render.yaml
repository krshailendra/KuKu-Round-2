# Full usable app on Render free tier
# https://render.com/docs/blueprint-spec
#
# After first deploy: free services sleep when idle (~15 min).
# Optional: free UptimeRobot ping /api/health every 5 min to reduce cold starts.
#
# Set GROQ_API_KEY in the Render dashboard (secret).

services:
  - type: web
    name: kuku-promo-finder
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_PUBLIC
        value: "1"
      - key: DEMO_MAX_EPISODES
        value: "50"
      - key: DEMO_DEFAULT_MODE
        value: "hybrid"
      - key: DEMO_LOCK_SEED
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
